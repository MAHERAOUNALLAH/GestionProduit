<div class="container mt-4">
  <div class="mb-3">
    <label class="form-label">ID</label>
    <input type="text" class="form-control" [value]="currentProduit.id" disabled>
  </div>
  <div class="mb-3">
    <label class="form-label">Nom</label>
    <input type="text" class="form-control" name="nomProduit" [(ngModel)]="currentProduit.nomProduit">
  </div>
  <div class="mb-3">
    <label class="form-label">Prix</label>
    <input type="number" class="form-control" name="prixProduit" [(ngModel)]="currentProduit.prixProduit">
  </div>
  <div class="mb-3">
    <label class="form-label">Date de création</label>
    <input type="date" class="form-control" name="dateCreation" [(ngModel)]="currentProduit.dateCreation">
  </div>
  <button class="btn btn-primary" (click)="updateProduit()">Modifier</button>
</div>
