<div class="container mt-4">
  <div class="mb-3">
    <label class="form-label">Nom</label>
    <input type="text" class="form-control" name="nomProduit" [(ngModel)]="newProduit.nomProduit">
  </div>
  <div class="mb-3">
    <label class="form-label">Prix</label>
    <input type="number" class="form-control" name="prixProduit" [(ngModel)]="newProduit.prixProduit">
  </div>
  <div class="mb-3">
    <label class="form-label">Date de création</label>
    <input type="date" class="form-control" name="dateCreation" [(ngModel)]="newProduit.dateCreation">
  </div>
  <button class="btn btn-primary" (click)="addProduit()">Ajouter</button>
</div>
