<div class="container mt-4">
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Prix</th>
        <th>Date de création</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (p of produits; track p.id) {
        <tr>
          <td>{{ p.id }}</td>
          <td>{{ p.nomProduit }}</td>
          <td>{{ p.prixProduit }}</td>
          <td>{{ p.dateCreation | date: 'dd/MM/yyyy' }}</td>
          <td>
            <a class="btn btn-success btn-sm me-2" [routerLink]="['/updateProduit', p.id]">Modifier</a>
            <button class="btn btn-danger btn-sm" (click)="supprimerProduit(p)">Supprimer</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
