<div class="container mt-3">
  <div class="card">
    <div class="card-body">
      <table class="table table-striped">
        <tr>
          <th>Id</th>
          <th>Nom</th>
          <th>Prix</th>
          <th>Date Création</th>
          <th>Action</th>
        </tr>
        <tbody>
          @for (produit of produits; track produit.idProduit) {
            <tr>
              <td>{{ produit.idProduit }}</td>
              <td>{{ produit.nomProduit }}</td>
              <td>{{ produit.prixProduit }}</td>
              <td>{{ produit.dateCreation | date:'dd/MM/yyyy' }}</td>
              <td>
                <button class="btn btn-danger btn-sm" (click)="supprimerProduit(produit)">
                  Supprimer
                </button>
                <a class="btn btn-success btn-sm ms-1" [routerLink]="['/updateproduit', produit.idProduit]">
                  Modifier
                </a>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
